; Local development PHP settings for VueFileManager
memory_limit = 512M
upload_max_filesize = 1024M
post_max_size = 1024M
max_execution_time = 300
max_input_time = 300

expose_php = Off
display_errors = On
log_errors = On
error_reporting = E_ALL

; Re-check changed files on every request — it's a development container
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
